<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom NYT Connections</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes pop-in {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in {
      animation: pop-in 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="bg-[#fcfbf9] text-gray-900 min-h-screen flex flex-col items-center select-none font-sans p-4">

  <!-- Top Navigation / Header -->
  <header class="w-full max-w-xl flex items-center justify-between pb-3 border-b border-gray-200 mb-4">
    <div class="flex items-center gap-2">
      <h1 class="text-2xl sm:text-3xl font-serif font-black tracking-tight">Connections</h1>
      <span class="text-xs font-mono uppercase bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-semibold">Custom</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-edit" class="px-3 py-1.5 text-xs sm:text-sm font-semibold border border-gray-800 rounded-full hover:bg-gray-100 transition-colors">
        Edit Puzzle
      </button>
      <button id="btn-share" class="px-3 py-1.5 text-xs sm:text-sm font-semibold bg-black text-white rounded-full hover:bg-gray-800 transition-colors">
        Share
      </button>
    </div>
  </header>

  <!-- Notification Toast -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-neutral-900 text-white px-4 py-2 rounded shadow-lg text-sm font-semibold transition-opacity duration-300 opacity-0 pointer-events-none z-50">
    Notification
  </div>

  <!-- Main Game Container -->
  <main class="w-full max-w-xl flex flex-col items-center flex-grow">
    <p class="text-sm sm:text-base text-gray-700 font-medium mb-4 text-center">
      Create four groups of four!
    </p>

    <!-- Solved Categories Banner Container -->
    <div id="solved-container" class="w-full flex flex-col gap-2 mb-2"></div>

    <!-- 4x4 Grid Container -->
    <div id="grid-container" class="w-full grid grid-cols-4 gap-2 mb-6"></div>

    <!-- Mistakes Left Tracker -->
    <div id="mistakes-section" class="flex items-center gap-2 mb-6 text-sm font-medium text-gray-700">
      <span>Mistakes remaining:</span>
      <div id="mistakes-dots" class="flex items-center gap-1.5">
        <span class="w-3 h-3 rounded-full bg-neutral-800 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-neutral-800 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-neutral-800 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-neutral-800 inline-block"></span>
      </div>
    </div>

    <!-- Game Control Buttons -->
    <div id="action-controls" class="flex flex-wrap justify-center gap-2 w-full max-w-md">
      <button id="btn-shuffle" class="px-4 py-2.5 rounded-full border border-gray-400 font-semibold text-xs sm:text-sm hover:border-gray-700 hover:bg-gray-50 active:scale-95 transition">
        Shuffle
      </button>
      <button id="btn-deselect" class="px-4 py-2.5 rounded-full border border-gray-400 font-semibold text-xs sm:text-sm hover:border-gray-700 hover:bg-gray-50 active:scale-95 transition">
        Deselect All
      </button>
      <button id="btn-submit" disabled class="px-5 py-2.5 rounded-full border border-gray-300 font-semibold text-xs sm:text-sm text-gray-400 cursor-not-allowed transition">
        Submit
      </button>
    </div>
  </main>

  <!-- Edit Puzzle Modal -->
  <div id="editor-modal" class="fixed inset-0 bg-black/60 z-40 hidden items-center justify-center p-3">
    <div class="bg-white w-full max-w-xl rounded-xl p-5 shadow-2xl max-h-[92vh] flex flex-col">
      <div class="flex justify-between items-center pb-3 border-b border-gray-200 mb-4">
        <h2 class="text-xl font-bold font-serif">Puzzle Editor</h2>
        <button id="btn-close-editor" class="text-gray-400 hover:text-gray-800 text-2xl leading-none">&times;</button>
      </div>

      <div class="text-xs text-gray-600 mb-3">
        Enter each category's title and its four corresponding words. <strong>Words will be displayed upon solving in the exact order entered here (left to right).</strong>
      </div>

      <form id="editor-form" class="space-y-4 overflow-y-auto pr-1 flex-grow"></form>

      <div class="pt-4 border-t border-gray-200 mt-2 flex justify-end gap-2">
        <button type="button" id="btn-cancel-editor" class="px-4 py-2 text-sm font-semibold rounded-lg border border-gray-300 hover:bg-gray-50">Cancel</button>
        <button type="button" id="btn-save-editor" class="px-5 py-2 text-sm font-semibold rounded-lg bg-black text-white hover:bg-gray-800">Save &amp; Play</button>
      </div>
    </div>
  </div>

  <script>
    const CATEGORY_COLORS = [
      { bg: 'bg-[#f9df6d]', border: 'border-[#f2d14b]', name: 'Yellow' },
      { bg: 'bg-[#a0c35a]', border: 'border-[#8eb146]', name: 'Green' },
      { bg: 'bg-[#b0c4ef]', border: 'border-[#98aee0]', name: 'Blue' },
      { bg: 'bg-[#ba81c5]', border: 'border-[#a86fb4]', name: 'Purple' }
    ];

    const DEFAULT_PUZZLE = [
      {
        title: "PARTS OF A BOOK",
        words: ["COVER", "SPINE", "PAGE", "JACKET"]
      },
      {
        title: "FOUND IN A SALAD",
        words: ["LETTUCE", "TOMATO", "CROUTON", "DRESSING"]
      },
      {
        title: "UNITS OF TIME",
        words: ["SECOND", "MINUTE", "HOUR", "DECADE"]
      },
      {
        title: "THINGS WITH KEYS",
        words: ["PIANO", "KEYBOARD", "MAP", "LOCKSMITH"]
      }
    ];

    let currentPuzzle = JSON.parse(JSON.stringify(DEFAULT_PUZZLE));
    let remainingWords = [];
    let selectedWords = [];
    let solvedCategories = [];
    let mistakesRemaining = 4;
    let guessHistory = [];

    const gridContainer = document.getElementById("grid-container");
    const solvedContainer = document.getElementById("solved-container");
    const btnSubmit = document.getElementById("btn-submit");
    const btnShuffle = document.getElementById("btn-shuffle");
    const btnDeselect = document.getElementById("btn-deselect");
    const mistakesDots = document.getElementById("mistakes-dots");
    const toast = document.getElementById("toast");
    const editorModal = document.getElementById("editor-modal");
    const editorForm = document.getElementById("editor-form");
    const btnEdit = document.getElementById("btn-edit");
    const btnCloseEditor = document.getElementById("btn-close-editor");
    const btnCancelEditor = document.getElementById("btn-cancel-editor");
    const btnSaveEditor = document.getElementById("btn-save-editor");
    const btnShare = document.getElementById("btn-share");

    function showToast(message, duration = 2000) {
      toast.textContent = message;
      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");
      setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0");
      }, duration);
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initGame(puzzleData) {
      currentPuzzle = JSON.parse(JSON.stringify(puzzleData));
      solvedCategories = [];
      selectedWords = [];
      mistakesRemaining = 4;
      guessHistory = [];

      remainingWords = [];
      currentPuzzle.forEach((cat, catIdx) => {
        cat.words.forEach((word) => {
          remainingWords.push({
            word: word.trim().toUpperCase(),
            categoryIndex: catIdx
          });
        });
      });

      remainingWords = shuffleArray(remainingWords);
      renderBoard();
      updateMistakesUI();
      updateControls();
    }

    function renderBoard() {
      solvedContainer.innerHTML = "";
      gridContainer.innerHTML = "";

      // Solved Banners
      solvedCategories.forEach((catIdx) => {
        const cat = currentPuzzle[catIdx];
        const color = CATEGORY_COLORS[catIdx % CATEGORY_COLORS.length];
        const banner = document.createElement("div");
        banner.className = `w-full ${color.bg} border ${color.border} rounded-lg py-4 px-3 text-center pop-in shadow-sm`;

        const titleEl = document.createElement("div");
        titleEl.className = "font-black text-sm sm:text-base tracking-wider uppercase text-neutral-900";
        titleEl.textContent = cat.title.toUpperCase();

        const wordsEl = document.createElement("div");
        // Increased font size and styled for clear emphasis
        wordsEl.className = "text-base sm:text-lg md:text-xl font-extrabold uppercase tracking-wide text-neutral-900 mt-1";
        wordsEl.textContent = cat.words.map(w => w.toUpperCase()).join(", ");

        banner.appendChild(titleEl);
        banner.appendChild(wordsEl);
        solvedContainer.appendChild(banner);
      });

      // Interactive Tiles
      remainingWords.forEach((item) => {
        const isSelected = selectedWords.includes(item.word);
        const tile = document.createElement("button");
        tile.type = "button";
        tile.textContent = item.word;
        tile.dataset.word = item.word;

        let baseClasses = "h-16 sm:h-20 rounded-md font-bold text-xs sm:text-sm md:text-base flex items-center justify-center p-2 text-center transition-all duration-150 active:scale-95 leading-tight uppercase select-none";
        if (isSelected) {
          tile.className = `${baseClasses} bg-[#5a594e] text-white`;
        } else {
          tile.className = `${baseClasses} bg-[#efefe6] hover:bg-[#e6e6dc] text-neutral-900`;
        }

        tile.addEventListener("click", () => handleTileClick(item.word));
        gridContainer.appendChild(tile);
      });
    }

    function handleTileClick(word) {
      if (selectedWords.includes(word)) {
        selectedWords = selectedWords.filter(w => w !== word);
      } else {
        if (selectedWords.length < 4) {
          selectedWords.push(word);
        }
      }
      renderBoard();
      updateControls();
    }

    function updateControls() {
      if (selectedWords.length === 4) {
        btnSubmit.disabled = false;
        btnSubmit.className = "px-5 py-2.5 rounded-full font-semibold text-xs sm:text-sm bg-neutral-900 text-white cursor-pointer hover:bg-neutral-800 active:scale-95 transition";
      } else {
        btnSubmit.disabled = true;
        btnSubmit.className = "px-5 py-2.5 rounded-full font-semibold text-xs sm:text-sm text-gray-400 border border-gray-300 cursor-not-allowed transition";
      }
    }

    function updateMistakesUI() {
      mistakesDots.innerHTML = "";
      for (let i = 0; i < mistakesRemaining; i++) {
        const dot = document.createElement("span");
        dot.className = "w-3 h-3 rounded-full bg-neutral-800 inline-block";
        mistakesDots.appendChild(dot);
      }
    }

    btnShuffle.addEventListener("click", () => {
      remainingWords = shuffleArray(remainingWords);
      renderBoard();
    });

    btnDeselect.addEventListener("click", () => {
      selectedWords = [];
      renderBoard();
      updateControls();
    });

    btnSubmit.addEventListener("click", () => {
      if (selectedWords.length !== 4) return;

      const categoryCounts = {};
      selectedWords.forEach(word => {
        const matched = remainingWords.find(item => item.word === word);
        if (matched) {
          categoryCounts[matched.categoryIndex] = (categoryCounts[matched.categoryIndex] || 0) + 1;
        }
      });

      const matchedCategoryIdx = Object.keys(categoryCounts).find(k => categoryCounts[k] === 4);

      if (matchedCategoryIdx !== undefined) {
        // Correct guess
        const catIdx = parseInt(matchedCategoryIdx, 10);
        solvedCategories.push(catIdx);
        remainingWords = remainingWords.filter(item => !selectedWords.includes(item.word));
        selectedWords = [];

        renderBoard();
        updateControls();

        if (solvedCategories.length === 4) {
          showToast("Outstanding!", 3000);
          confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      } else {
        // Check for 'one away'
        const isOneAway = Object.values(categoryCounts).includes(3);
        if (isOneAway) {
          showToast("One away...");
        }

        // Shake selected tiles
        const selectedElements = Array.from(gridContainer.children).filter(el =>
          selectedWords.includes(el.dataset.word)
        );
        selectedElements.forEach(el => el.classList.add("shake"));
        setTimeout(() => {
          selectedElements.forEach(el => el.classList.remove("shake"));
        }, 400);

        mistakesRemaining--;
        updateMistakesUI();

        if (mistakesRemaining === 0) {
          showToast("Game Over! Revealing answers...", 2500);
          setTimeout(revealAllAnswers, 1200);
        }
      }
    });

    function revealAllAnswers() {
      currentPuzzle.forEach((cat, idx) => {
        if (!solvedCategories.includes(idx)) {
          solvedCategories.push(idx);
        }
      });
      remainingWords = [];
      selectedWords = [];
      renderBoard();
      updateControls();
    }

    // Editor Logic
    function populateEditorForm() {
      editorForm.innerHTML = "";
      currentPuzzle.forEach((category, cIdx) => {
        const group = document.createElement("div");
        group.className = "p-3 border rounded-lg bg-gray-50/70";

        const titleLabel = document.createElement("label");
        titleLabel.className = "block text-xs font-bold uppercase tracking-wider mb-1 text-gray-700";
        titleLabel.textContent = `Group ${cIdx + 1} (${CATEGORY_COLORS[cIdx].name} Category)`;

        const titleInput = document.createElement("input");
        titleInput.type = "text";
        titleInput.id = `cat-title-${cIdx}`;
        titleInput.placeholder = "Category Description";
        titleInput.value = category.title;
        titleInput.className = "w-full text-sm font-semibold border rounded px-2.5 py-1.5 mb-2 focus:ring-2 focus:ring-black outline-none";

        const wordsLabel = document.createElement("label");
        wordsLabel.className = "block text-xs font-medium text-gray-500 mb-1";
        wordsLabel.textContent = "Words (displayed left-to-right on solve):";

        const wordsGrid = document.createElement("div");
        wordsGrid.className = "grid grid-cols-2 sm:grid-cols-4 gap-2";

        category.words.forEach((word, wIdx) => {
          const wordInput = document.createElement("input");
          wordInput.type = "text";
          wordInput.id = `cat-${cIdx}-word-${wIdx}`;
          wordInput.placeholder = `Word ${wIdx + 1}`;
          wordInput.value = word;
          wordInput.className = "w-full text-xs sm:text-sm uppercase font-semibold border rounded px-2 py-1.5 focus:ring-2 focus:ring-black outline-none";
          wordsGrid.appendChild(wordInput);
        });

        group.appendChild(titleLabel);
        group.appendChild(titleInput);
        group.appendChild(wordsLabel);
        group.appendChild(wordsGrid);
        editorForm.appendChild(group);
      });
    }

    btnEdit.addEventListener("click", () => {
      populateEditorForm();
      editorModal.classList.remove("hidden");
      editorModal.classList.add("flex");
    });

    const closeEditorModal = () => {
      editorModal.classList.add("hidden");
      editorModal.classList.remove("flex");
    };

    btnCloseEditor.addEventListener("click", closeEditorModal);
    btnCancelEditor.addEventListener("click", closeEditorModal);

    btnSaveEditor.addEventListener("click", () => {
      const newPuzzle = [];
      const allWordsSet = new Set();

      for (let c = 0; c < 4; c++) {
        const titleVal = document.getElementById(`cat-title-${c}`).value.trim();
        if (!titleVal) {
          alert(`Please fill in the title for Category ${c + 1}`);
          return;
        }

        const words = [];
        for (let w = 0; w < 4; w++) {
          const wVal = document.getElementById(`cat-${c}-word-${w}`).value.trim().toUpperCase();
          if (!wVal) {
            alert(`Please complete all 4 words for Category ${c + 1}`);
            return;
          }
          if (allWordsSet.has(wVal)) {
            alert(`Duplicate word detected: "${wVal}". All 16 words across categories must be unique.`);
            return;
          }
          allWordsSet.add(wVal);
          words.push(wVal);
        }

        newPuzzle.push({ title: titleVal, words });
      }

      closeEditorModal();
      initGame(newPuzzle);
      updateUrlHash(newPuzzle);
      showToast("Puzzle saved!");
    });

    function updateUrlHash(puzzle) {
      try {
        const serialized = btoa(encodeURIComponent(JSON.stringify(puzzle)));
        history.replaceState(null, "", `#${serialized}`);
      } catch (err) {
        console.error("Could not serialize puzzle to hash", err);
      }
    }

    function loadPuzzleFromUrl() {
      if (window.location.hash && window.location.hash.length > 1) {
        try {
          const hashData = window.location.hash.slice(1);
          const parsed = JSON.parse(decodeURIComponent(atob(hashData)));
          if (Array.isArray(parsed) && parsed.length === 4) {
            return parsed;
          }
        } catch (e) {
          console.warn("Invalid hash puzzle data, using defaults.");
        }
      }
      return null;
    }

    btnShare.addEventListener("click", () => {
      updateUrlHash(currentPuzzle);
      navigator.clipboard.writeText(window.location.href)
        .then(() => showToast("Shareable link copied to clipboard!"))
        .catch(() => showToast("Failed to copy URL"));
    });

    // Initial Load
    const loadedData = loadPuzzleFromUrl();
    initGame(loadedData || DEFAULT_PUZZLE);
  </script>
</body>
</html>
